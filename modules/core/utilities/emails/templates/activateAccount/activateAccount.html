<!DOCTYPE html>
<html lang="{htmlLang}" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <!--[if !mso]><!-->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!--<![endif]-->
  <title>{heading}</title>

  <!--[if gte mso 9]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->

  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600,700&display=swap" rel="stylesheet" type="text/css">
  <!--<![endif]-->

  <style type="text/css">
    /* ---------- reset ---------- */
    html, body { margin: 0 !important; padding: 0 !important; height: 100% !important; width: 100% !important; }
    body { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    p { margin: 0; }
    * { line-height: inherit; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
    #MessageViewBody a { color: inherit; text-decoration: none; }
    .ExternalClass { width: 100%; }
    .ExternalClass, .ExternalClass p, .ExternalClass td, .ExternalClass div, .ExternalClass span, .ExternalClass font { line-height: 100%; }

    /* ---------- links ---------- */
    a { color: #b8873a; }

    /* ---------- responsive ---------- */
    @media only screen and (max-width: 620px) {
      .a-container { width: 100% !important; max-width: 100% !important; }
      .a-gutter { padding-left: 24px !important; padding-right: 24px !important; }
      .a-heading { font-size: 24px !important; line-height: 132% !important; }
      .a-brand { font-size: 20px !important; }
      .a-card-top { padding-top: 32px !important; }
      .a-card-bottom { padding-bottom: 32px !important; }
      .a-btn a { display: block !important; width: 100% !important; box-sizing: border-box !important; }
      .a-outer { padding: 16px 8px !important; }
    }
  </style>
</head>

<body style="margin:0;padding:0;width:100%;background-color:#f2f3f5;color:#2c3037;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;">

  <!-- preheader: shown in the inbox preview, hidden in the body -->
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;color:#f2f3f5;">{preheader}</div>
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;color:#f2f3f5;">&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;</div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#f2f3f5" style="background-color:#f2f3f5;width:100%;min-width:320px;">
    <tr>
      <td class="a-outer" align="center" style="padding:32px 12px;">

        <!--[if (mso)|(IE)]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" align="center"><tr><td><![endif]-->
        <table role="presentation" class="a-container" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;margin:0 auto;">

          <!-- ============ header ============ -->
          <tr>
            <td align="center" bgcolor="#111114" style="background-color:#111114;border-radius:14px 14px 0 0;padding:30px 24px 26px;">
              <p class="a-brand" style="margin:0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:23px;font-weight:700;letter-spacing:0.04em;line-height:130%;color:#ffffff;">{pageName}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:14px auto 0;">
                <tr>
                  <td width="44" height="3" bgcolor="#cca250" style="width:44px;height:3px;background-color:#cca250;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ============ card ============ -->
          <tr>
            <td class="a-gutter a-card-top" bgcolor="#ffffff" align="left" style="background-color:#ffffff;padding:44px 48px 0;">

              <!-- heading -->
              <p class="a-heading" style="margin:0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;line-height:138%;color:#111114;text-align:center;">{heading}</p>

              <!-- greeting -->
              <p style="margin:26px 0 0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:170%;color:#111114;">{greeting}</p>

              <!-- body -->
              <p style="margin:10px 0 0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400;line-height:180%;color:#4b5058;">{body}</p>

              <!-- call to action -->
              <table role="presentation" class="a-btn" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
                <tr>
                  <td align="center" style="padding:32px 0 4px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="http://1234.html" style="height:50px;v-text-anchor:middle;width:300px;" arcsize="20%" stroke="f" fillcolor="#cca250">
                      <w:anchorlock/>
                      <center style="color:#111114;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;">{ctaLabel}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="http://1234.html" target="_blank" rel="noopener" style="display:inline-block;padding:16px 38px;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;line-height:100%;color:#111114;text-decoration:none;background-color:#cca250;border-radius:10px;">{ctaLabel}</a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>

              <!-- link fallback -->
              <p style="margin:28px 0 0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400;line-height:170%;color:#8a9099;">{fallbackLabel}</p>
              <p style="margin:6px 0 0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:170%;word-break:break-all;">
                <a href="http://1234.html" target="_blank" rel="noopener" style="color:#b8873a;text-decoration:underline;">http://1234.html</a>
              </p>

              <!-- security note -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
                <tr>
                  <td style="padding:26px 0 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
                      <tr>
                        <td bgcolor="#faf7f1" style="background-color:#faf7f1;border-left:3px solid #cca250;border-radius:0 8px 8px 0;padding:15px 18px;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;line-height:170%;color:#6b5a3c;">{note}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- divider + ignore line -->
          <tr>
            <td class="a-gutter a-card-bottom" bgcolor="#ffffff" align="left" style="background-color:#ffffff;border-radius:0 0 14px 14px;padding:0 48px 44px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
                <tr>
                  <td height="1" style="height:1px;font-size:0;line-height:0;border-top:1px solid #eceef1;padding-top:28px;">&nbsp;</td>
                </tr>
              </table>
              <p style="margin:22px 0 0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;line-height:175%;color:#8a9099;">{ignore}</p>
            </td>
          </tr>

          <!-- ============ footer ============ -->
          <tr>
            <td align="center" style="padding:26px 24px 8px;">
              <p style="margin:0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400;line-height:175%;color:#9aa0a8;text-align:center;">{footerNote}</p>
              <p style="margin:10px 0 0;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400;line-height:175%;color:#b0b5bc;text-align:center;">{copyright}</p>
            </td>
          </tr>

        </table>
        <!--[if (mso)|(IE)]></td></tr></table><![endif]-->

      </td>
    </tr>
  </table>
</body>

</html>
